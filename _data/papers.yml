# ------------------------------------------------------------------
# Your publications.
# Add or remove entries under each list — index.html loops over these
# automatically, so you never need to touch the HTML to update papers.
# Leave "link" as "#" if you don't have a URL yet.
#
# IMPORTANT: each entry MUST start with "- " (dash, space) before "title:".
# The dash is what tells YAML "this is one item in a list" — without it,
# the file isn't a list anymore and Jekyll's build breaks.
# Also make sure quotes are straight quotes ("), not curly/smart quotes
# (" " or ” “) — pasting from Word, Notes, or Google Docs often swaps
# them automatically, and YAML can't parse a curly quote as a string
# terminator.
# ------------------------------------------------------------------

